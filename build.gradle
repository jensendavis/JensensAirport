plugins {
    id "java"
    id "application"
    id "checkstyle"
    id "com.github.spotbugs" version "5.0.13"
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'airport.AirportSimulation'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}

apply plugin: 'checkstyle'
checkstyle {
    // Keep checkstyle a little quieter
    ignoreFailures = true
    showViolations = false
}

tasks.withType(Checkstyle) {
}
checkstyle {
    toolVersion = "8.8"
}


spotbugs {
    toolVersion = '4.8.4'
    ignoreFailures = true
    showProgress = true
    effort = 'max'
    reportLevel = 'low'
}